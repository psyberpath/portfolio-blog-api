version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
      POSTGRES_DATABASE: blog_db
    ports:
      - '5432:5432'
    volumes:
      - blog-db-data-v3:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  blog-db-data-v3:
  redis-data:
